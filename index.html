<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Bolso</title>
    <meta name="description" content="Gerenciamento de estoque rápido e fácil">
    <!-- Google Fonts para tipografia premium -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Estoque de Bolso</h1>
        </header>

        <section class="form-section glass-panel">
            <form id="add-form">
                <div class="input-group">
                    <input type="text" id="nome" placeholder="Nome do Produto (Ex: Trufa de Morango)" required autocomplete="off">
                </div>
                <div class="row">
                    <div class="input-group half">
                        <input type="number" id="preco" placeholder="Preço R$" step="0.01" min="0" required>
                    </div>
                    <div class="input-group half">
                        <input type="number" id="quantidade" placeholder="Qtd Inicial" min="0" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Adicionar Produto</button>
            </form>
        </section>

        <section class="list-section">
            <div class="list-header">
                <h2>Seu Estoque</h2>
                <div id="global-total" class="global-total">Total: R$ 0,00</div>
            </div>
            <ul id="product-list">
                <!-- A lista de produtos será gerada dinamicamente via JS -->
            </ul>
        </section>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
